[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lasteverlm-account"
version = "0.1.0.dev0"
description = "lasteverLM account service: magic-link login, credits and vouchers, admin settings, privacy-preserving visitor log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Oliver Zehentleitner" }]
dependencies = [
  "lasteverlm-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary,pool]>=3.2",
  "PyJWT>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "anyio>=4",
  "ruff>=0.5",
  "black>=24",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/oliver-zehentleitner/lasteverLM/tree/main/account"
Repository = "https://github.com/oliver-zehentleitner/lasteverLM"

# core lives in ../core of the same repository; nothing is published to PyPI.
[tool.uv.sources]
lasteverlm-core = { path = "../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/lasteverlm_account"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lasteverlm_account"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psycopg.*", "psycopg_pool.*"]
ignore_missing_imports = true
