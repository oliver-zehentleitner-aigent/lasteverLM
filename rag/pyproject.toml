[project]
name = "lasteverlm-rag"
version = "0.1.0"
description = "lasteverLM rag service: retrieval, cited answers, message history"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "lasteverlm-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    # the negation check (lasteverlm_rag/negation.py): spaCy and its two small
    # models, pinned with their hashes; click because spaCy's CLI imports it
    "spacy==3.8.7",
    "click==8.1.8",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl#sha256=fec69fec52b1780f2d269d5af7582a5e28028738bd3190532459aeb473bfa3e7",
]

[project.scripts]
lasteverlm-rag-worker = "lasteverlm_rag.worker:main"
lasteverlm-rag-repair-audio = "lasteverlm_rag.repair_audio:main"
lasteverlm-rag-repair-reports = "lasteverlm_rag.repair_reports:main"
lasteverlm-rag-orphans = "lasteverlm_rag.orphans:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "black>=24.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lasteverlm_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs RAG_TEST_DATABASE_URL (make test-postgres)"]
addopts = "-m 'not postgres'"
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lasteverlm_rag"]
