[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lasteverlm-ingest"
version = "0.1.0.dev0"
description = "lasteverLM ingest service: upload, parsing, chunking, embeddings, notebook and source endpoints"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Oliver Zehentleitner" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "boto3>=1.34",
  "openai>=1.40",
  "pypdf>=4.2",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-boto3>=1.0",
]

[project.scripts]
lasteverlm-ingest-worker = "lasteverlm_ingest.worker:main"

[project.urls]
Homepage = "https://github.com/oliver-zehentleitner/lasteverLM"

[tool.hatch.build.targets.wheel]
packages = ["src/lasteverlm_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["lasteverlm_ingest"]
ignore_missing_imports = true
check_untyped_defs = true
