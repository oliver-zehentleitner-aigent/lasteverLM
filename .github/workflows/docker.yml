name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account, ingest, rag, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: skip services without a Dockerfile yet
        id: gate
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.gate.outputs.run == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.gate.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.gate.outputs.run == 'true'
        id: meta
        with:
          images: ghcr.io/oliver-zehentleitner/lasteverlm-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # Build context is the repository root so that core/ can be copied in.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance with the full build parameters and an SBOM, attached to the image index.
          provenance: mode=max
          sbom: true
          # Build cache in the registry, one tag per service, every stage (mode=max):
          # unlike the GHA cache it has no 10 GB repository cap that evicts stages.
          cache-from: type=registry,ref=ghcr.io/oliver-zehentleitner/lasteverlm-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/oliver-zehentleitner/lasteverlm-${{ matrix.service }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
