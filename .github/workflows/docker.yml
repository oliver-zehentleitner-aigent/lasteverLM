name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account, ingest, rag, web]
    steps:
      - uses: actions/checkout@v4
      - name: skip services without a Dockerfile yet
        id: gate
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: steps.gate.outputs.run == 'true'
        id: meta
        with:
          images: ghcr.io/oliver-zehentleitner/lasteverlm-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # Build context is the repository root so that core/ can be copied in.
      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.run == 'true'
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
