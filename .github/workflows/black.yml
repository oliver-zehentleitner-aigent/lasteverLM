name: black

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet black==26.10.1
      # One run per directory: each has its own pyproject.toml (line length
      # 100); run from the root, black would take its defaults instead.
      - name: black --check per Python directory
        run: |
          for d in core account ingest rag infra; do
            echo "== $d"
            (cd "$d" && black --check --diff .)
          done
