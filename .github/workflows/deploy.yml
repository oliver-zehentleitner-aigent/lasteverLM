name: deploy

# Never on a merge. Runs after `docker` finished for a tag v*, or by hand
# with a tag that already has images.
on:
  workflow_run:
    workflows: [docker]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: image tag to roll out (a Git tag like v0.1.0, or a full SHA)
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    # The configuration (domain, models, prices, S3 endpoint) is committed in
    # infra/chart/values-prod.yaml; the only required secret is KUBECONFIG_B64.
    steps:
      # The secrets context is not available in a step `if`; the gate reads it from env.
      # Without the kubeconfig secret the job ends green with a message, so a tag
      # before the repository secrets exist still produces images.
      - name: gate on the kubeconfig secret
        id: gate
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "deploy skipped: no kubeconfig secret (KUBECONFIG_B64); images for $TAG exist, run make deploy TAG=$TAG from an operator machine"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: azure/setup-helm@v5
        if: steps.gate.outputs.run == 'true'
      - uses: azure/setup-kubectl@v5
        if: steps.gate.outputs.run == 'true'
      - name: kubeconfig
        if: steps.gate.outputs.run == 'true'
        working-directory: infra
        run: |
          mkdir -p build
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > build/kubeconfig
          chmod 600 build/kubeconfig
      - name: helm upgrade --install at ${{ env.TAG }}
        if: steps.gate.outputs.run == 'true'
        working-directory: infra
        run: make deploy TAG="$TAG"
      - name: smoke test
        if: steps.gate.outputs.run == 'true'
        working-directory: infra
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then echo "DEMO_TOKEN not configured, smoke test skipped"; exit 0; fi
          make smoke
