name: deploy

# Never on a merge. Runs after `docker` finished for a tag v*, or by hand
# with a tag that already has images.
on:
  workflow_run:
    workflows: [docker]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: image tag to roll out (a Git tag like v0.1.0, or a full SHA)
        required: true

# The token only checks the repository out; cluster access is the kubeconfig secret.
permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: production
    # On the job, not the workflow: every docker run on main also starts this
    # workflow, and the job's `if` skips it. A skipped job never enters the group;
    # a workflow-level group let those runs push a pending tag deploy out (GitHub
    # keeps one pending run per group and cancels the older one).
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      # What is checked out. After docker: the exact commit docker built, not the
      # tag name, which could be moved between the build and this checkout while
      # secrets are in scope. By hand: the input as given; only a maintainer
      # with write access can dispatch, and the run starts on that click.
      CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
    # The configuration (domain, models, prices, S3 endpoint) is committed in
    # infra/chart/values-prod.yaml; the only required secret is KUBECONFIG_B64.
    steps:
      # The secrets context is not available in a step `if`; the gate reads it from env.
      # Without the kubeconfig secret the job ends green with a message, so a tag
      # before the repository secrets exist still produces images.
      - name: gate on the kubeconfig secret
        id: gate
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "deploy skipped: no kubeconfig secret (KUBECONFIG_B64); images for $TAG exist, run make deploy TAG=$TAG from an operator machine"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        if: steps.gate.outputs.run == 'true'
      - name: kubeconfig
        if: steps.gate.outputs.run == 'true'
        working-directory: infra
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p build
          printf '%s' "$KUBECONFIG_B64" | base64 -d > build/kubeconfig
          chmod 600 build/kubeconfig
      - name: helm upgrade --install at ${{ env.TAG }}
        if: steps.gate.outputs.run == 'true'
        working-directory: infra
        run: make deploy TAG="$TAG"
      - name: smoke test
        if: steps.gate.outputs.run == 'true'
        working-directory: infra
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then echo "DEMO_TOKEN not configured, smoke test skipped"; exit 0; fi
          make smoke
