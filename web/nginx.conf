# Static SPA. Unprivileged port so the container runs as the nginx user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every app route (/, /admin, /auth/callback) is index.html; never cache it.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
