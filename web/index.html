<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>lasteverLM</title>
    <script>
      // the theme before the first paint, so a dark choice never flashes light:
      // this session's toggle, else the saved choice, else light
      try {
        var theme = sessionStorage.getItem('lasteverlm.theme.session') || localStorage.getItem('lasteverlm.theme') || 'light'
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
