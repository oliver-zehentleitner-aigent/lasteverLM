# Included in every location: nginx drops server-level add_header lines in
# any location that sets its own, so they cannot live one level up.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
# the Content-Security-Policy, written at image build by scripts/csp.mjs
# (build arg CSP: off, report or enforce) with the inline script's hash
include /etc/nginx/csp.conf;
