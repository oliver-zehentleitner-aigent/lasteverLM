site_name: lasteverLM
site_description: "A NotebookLM-style assistant: provide documents, ask questions, get cited answers. One repository, six services, everything on Vultr."
site_url: https://oliver-zehentleitner.github.io/lasteverLM/
repo_url: https://github.com/oliver-zehentleitner/lasteverLM
repo_name: oliver-zehentleitner/lasteverLM
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

nav:
  - Home: index.md
  - The project: project.md
  - Architecture and API contract: architecture.md
  - The RAG pipeline: rag-pipeline.md
  - User interface: ui.md
  - Walkthrough script: walkthrough.md
  - Repository standard: repository-standard.md
  - Why it is built this way: https://oliver-zehentleitner.github.io/lasteverLM/keep-the-why-dashboard/
  - Services:
      - core: https://github.com/oliver-zehentleitner/lasteverLM/tree/main/core
      - account: https://github.com/oliver-zehentleitner/lasteverLM/tree/main/account
      - infra: https://github.com/oliver-zehentleitner/lasteverLM/tree/main/infra
      - ingest: https://github.com/oliver-zehentleitner/lasteverLM/tree/main/ingest
      - rag: https://github.com/oliver-zehentleitner/lasteverLM/tree/main/rag
      - web: https://github.com/oliver-zehentleitner/lasteverLM/tree/main/web
