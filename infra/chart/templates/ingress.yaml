apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lasteverlm
  labels:
    {{- include "lasteverlm.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.bodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.readTimeout | quote }}
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.rateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.rateLimit.burstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.rateLimit.connections | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "domain is required" .Values.domain | quote }}]
      secretName: lasteverlm-tls
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          {{- range $name := list "account" "ingest" "rag" }}
          - path: /api/{{ $name }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: {name: http}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {name: http}
