apiVersion: v1
kind: ConfigMap
metadata:
  name: lasteverlm-config
  labels:
    {{- include "lasteverlm.labels" . | nindent 4 }}
data:
  PUBLIC_BASE_URL: {{ printf "https://%s" (required "domain is required" .Values.domain) | quote }}
  INFERENCE_BASE_URL: {{ .Values.config.inferenceBaseUrl | quote }}
  LLM_MODEL: {{ required "config.llmModel is required" .Values.config.llmModel | quote }}
  EMBEDDING_MODEL: {{ required "config.embeddingModel is required" .Values.config.embeddingModel | quote }}
  EMBEDDING_DIMENSION: {{ .Values.config.embeddingDimension | quote }}
  {{- $prices := required "config.modelPrices is required until core ships defaults" .Values.config.modelPrices }}
  {{- with (fromJson $prices).Error }}
  {{- fail (printf "config.modelPrices is not valid JSON: %s" .) }}
  {{- end }}
  MODEL_PRICES: {{ $prices | quote }}
  S3_ENDPOINT: {{ required "config.s3Endpoint is required" .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  VOUCHER_DEFAULT_CENTS: {{ .Values.config.voucherDefaultCents | quote }}
  PDF_VISION_MAX_PAGES: {{ .Values.config.pdfVisionMaxPages | quote }}
  {{- with .Values.appVersion }}
  APP_VERSION: {{ . | quote }}
  {{- end }}
  {{- with .Values.appCommit }}
  APP_COMMIT: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.similarityFloor }}
  SIMILARITY_FLOOR: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.ttsModel }}
  TTS_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.ttsVoice }}
  TTS_VOICE: {{ . | quote }}
  {{- end }}
