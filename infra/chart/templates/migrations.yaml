{{- if and .Values.migrations.enabled (.Files.Get "files/migrations.tgz") }}
# Pre-install/pre-upgrade hook: every service's migrations, collected by
# `make migrations` into files/migrations.tgz, applied by db/migrate.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lasteverlm-migrations
  labels:
    {{- include "lasteverlm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  migrate.sh: |
{{ .Files.Get "files/migrate.sh" | indent 4 }}
binaryData:
  migrations.tgz: {{ .Files.Get "files/migrations.tgz" | b64enc }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lasteverlm-migrate
  labels:
    app.kubernetes.io/name: migrate
    {{- include "lasteverlm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.migrations.image }}
          command: ["sh", "-c", "mkdir -p /work && tar xzf /in/migrations.tgz -C /work && sh /in/migrate.sh /work"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrations.adminSecret }}
                  key: DATABASE_URL
            - name: EMBEDDING_DIMENSION
              value: {{ .Values.config.embeddingDimension | quote }}
          volumeMounts:
            - name: migrations
              mountPath: /in
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: lasteverlm-migrations
{{- end }}
