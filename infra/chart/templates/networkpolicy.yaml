{{- if .Values.networkPolicy.enabled }}
{{- /* Ingress only. Nothing in the namespace accepts a connection except from the
     ingress controller, for the health probes of the System page from
     account to the other API services, and from rag to ingest's API
     (reading sources when used, the agent chat's steps). Kubelet probes come from the node and
     are always allowed. Egress stays open: see context/cluster.md. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "lasteverlm.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Every pod, any port: the API services, web, and cert-manager's HTTP-01
# solver pods, which run in this namespace and are reached through nginx.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-ingress-controller
  labels:
    {{- include "lasteverlm.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-health-probes
  labels:
    {{- include "lasteverlm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: account
      ports:
        - port: http
---
# rag's API and worker call ingest's API (INGEST_URL, default http://ingest):
# sources are read when an answer or an output needs them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-to-ingest
  labels:
    {{- include "lasteverlm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingest
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [rag, rag-worker]
      ports:
        - port: http
{{- end }}
