# Defaults for every deployment. Deployment-specific values (domain, model
# names, prices, S3 endpoint) are in values-prod.yaml; `make deploy` sets the
# image tag and registry.

registry: ghcr.io/oliver-zehentleitner
imageTag: latest
# The build every /healthz reports (APP_VERSION, APP_COMMIT); `make deploy` sets
# both, TAG and the full SHA of the checked-out commit. Empty = "unknown".
appVersion: ""
appCommit: ""
imagePullPolicy: IfNotPresent

# Public host and the ACME contact for Let's Encrypt. Both required for deploy.
domain: ""
acmeEmail: ""

# Non-secret configuration, rendered into the ConfigMap lasteverlm-config.
# Secrets (database, S3, inference key, JWT secret, account seeds) are created
# by `make secrets` outside the chart and referenced by name below.
config:
  inferenceBaseUrl: https://api.vultrinference.com/v1
  llmModel: ""
  embeddingModel: ""
  embeddingDimension: 1536
  modelPrices: ""       # JSON, required until core ships defaults
  similarityFloor: ""   # empty = the service's default
  ttsModel: ""          # optional, rag audio outputs
  ttsVoice: ryan        # rag audio voice; the platform does not take the OpenAI names
  sttModel: ""          # empty = core's default (whisper-large-v3-turbo), ingest audio sources
  s3Endpoint: ""        # from `make secrets` / tofu outputs, or set here
  s3Bucket: lasteverlm-sources
  voucherDefaultCents: 1000   # account: credit of a new voucher, in cents
  pdfVisionMaxPages: 100      # ingest worker: most pages of one PDF the vision model reads; more fail the source

ingress:
  className: nginx
  clusterIssuer: letsencrypt
  bodySize: 64m
  readTimeout: 120
  # Coarse per-IP rate limiting at the edge (ingress-nginx annotations).
  # The fine layer (blocks, bans) is a middleware in core.
  rateLimit:
    rps: 10
    burstMultiplier: 5   # burst = rps * multiplier
    connections: 20

# NetworkPolicies (templates/networkpolicy.yaml): pods accept connections only
# from the ingress controller's namespace and, on the API port, from account.
# VKE's CNI (Calico) enforces them.
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

# CA of the managed PostgreSQL, created by `make secrets` from PGSSLROOTCERT;
# mounted read-only, every DATABASE_URL uses sslmode=verify-full against it.
pgCa:
  configMap: lasteverlm-pg-ca
  mountPath: /etc/lasteverlm

# API services: same shape, one image each. `secrets` are mounted with envFrom,
# `optionalSecrets` likewise but may be absent. `worker` adds a second
# Deployment from the same image with the worker entrypoint. Every image sets a
# numeric USER, which runAsNonRoot verifies; `runAsUser` is only needed for an
# image that names its user instead. `kubernetesRead` gives the API Deployment
# its own ServiceAccount with get/list on this namespace's pods and deployments
# (templates/rbac.yaml); the worker keeps the default one.
apiPort: 8000
# Every container runs with a read-only root filesystem; /tmp is an emptyDir
# of at most this size (the pod is evicted above it).
tmpSizeLimit: 256Mi
services:
  account:
    replicas: 2
    secrets: [lasteverlm-db, lasteverlm-auth, lasteverlm-account]
    optionalSecrets: [lasteverlm-smtp]
    kubernetesRead: true   # admin System page: lists pods and deployments
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}
    hpa: {enabled: true, min: 2, max: 5, cpu: 80}
  ingest:
    replicas: 2
    secrets: [lasteverlm-db, lasteverlm-s3, lasteverlm-inference, lasteverlm-auth]
    optionalSecrets: []
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}
    hpa: {enabled: true, min: 2, max: 5, cpu: 80}
    worker:
      enabled: true
      replicas: 2
      command: [lasteverlm-ingest-worker]   # same image as the API, claims jobs from Postgres
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {memory: 2Gi}
      hpa: {enabled: true, min: 2, max: 6, cpu: 80}
  rag:
    replicas: 2
    secrets: [lasteverlm-db, lasteverlm-s3, lasteverlm-inference, lasteverlm-auth]
    optionalSecrets: []
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}
    hpa: {enabled: true, min: 2, max: 5, cpu: 80}
    worker:
      enabled: true
      replicas: 2
      command: [lasteverlm-rag-worker]
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {memory: 2Gi}
      hpa: {enabled: true, min: 2, max: 6, cpu: 80}

web:
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  hpa: {enabled: true, min: 2, max: 4, cpu: 80}

# Migrations run as a pre-install/pre-upgrade hook Job when
# files/migrations.tgz exists in the chart (written by `make migrations`).
# The image is pinned by digest; uid 70 is the image's postgres user, which
# the image names instead of a number.
migrations:
  enabled: true
  image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  runAsUser: 70
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  adminSecret: lasteverlm-db-admin
  backoffLimit: 0
  activeDeadlineSeconds: 600
