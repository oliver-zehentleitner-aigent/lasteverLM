# Local stand-in for the production ingress (infra/chart/templates/ingress.yaml):
# same paths, same body size and read timeout, no TLS. Upstreams are resolved
# per request through Docker's DNS, so a recreated container is found again.
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 64m;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/account { set $up account:8000; proxy_pass http://$up; }
    location /api/ingest  { set $up ingest:8000;  proxy_pass http://$up; }
    location /api/rag     { set $up rag:8000;     proxy_pass http://$up; }
    location /            { set $up web:8080;     proxy_pass http://$up; }
}
