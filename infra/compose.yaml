# Local development stack: PostgreSQL with pgvector, S3-compatible storage
# (RustFS), Mailpit, every service built from this checkout, and a gateway
# that routes like the production ingress. Run from infra/:
#   docker compose up --build        (or: make local-up)
# Open http://localhost:8080 (app), http://localhost:8025 (Mailpit),
# http://localhost:9001 (storage console). Every port binds to 127.0.0.1.
#
# The only value it needs from outside is INFERENCE_API_KEY (Vultr Serverless
# Inference); models default to the deployed ones and can be overridden from
# the shell environment. Everything else below is a local-only development
# value: none of it is used by the deployment (chart + `make secrets`).

name: lasteverlm

x-dev: &dev
  # Local-only values, not secrets; production generates its own (`make secrets`).
  DATABASE_URL: postgresql://lasteverlm:local-dev-password@postgres:5432/lasteverlm
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-only-jwt-secret-do-not-deploy}
  DEMO_TOKEN: ${DEMO_TOKEN:-local-demo-token}
  PUBLIC_BASE_URL: http://localhost:8080
  INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-https://api.vultrinference.com/v1}
  INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-qwen3.8-27b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-4b}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  # Cents per million tokens of the default models (tts and stt per million seconds
  # of audio, decision per million input tokens), from `GET /v1/models`.
  MODEL_PRICES: ${MODEL_PRICES:-{"qwen3.8-27b":{"in":15,"out":100},"qwen3-embedding-4b":{"in":5,"out":5},"qwen3-tts-12hz-1.7b":{"in":28000,"out":28000},"whisper-large-v3-turbo":{"in":1111,"out":1111},"clef":{"in":10,"out":0},"clef-flash":{"in":5,"out":0},"glm-5.3-flash":{"in":10,"out":35},"deepseek-v4.1-flash":{"in":15,"out":60},"glm-5.3":{"in":75,"out":300}}}
  TTS_MODEL: ${TTS_MODEL:-qwen3-tts-12hz-1.7b}
  TTS_VOICE: ${TTS_VOICE:-ryan}
  STT_MODEL: ${STT_MODEL:-whisper-large-v3-turbo}
  DECISION_MODEL: ${DECISION_MODEL:-clef}
  JUDGE_MODELS: ${JUDGE_MODELS:-{"low":"deepseek-v4.1-flash","medium":"glm-5.3-flash","high":"glm-5.3"}}
  S3_ENDPOINT: http://storage:9000
  S3_BUCKET: lasteverlm-sources
  S3_REGION: us-east-1
  S3_ACCESS_KEY: local-dev-access
  S3_SECRET_KEY: local-dev-secret-key
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
  interval: 5s
  retries: 12

x-python-service: &python-service
  restart: unless-stopped
  environment: *dev
  depends_on:
    migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_PASSWORD: local-dev-admin-password
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  # Same scripts as the deployment: bootstrap (role, database, pgvector), then
  # every service's migrations in order, each under SET ROLE lasteverlm.
  migrate:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:local-dev-admin-password@postgres:5432/postgres
      APP_DB_PASSWORD: local-dev-password
      DATABASE_URL: postgresql://postgres:local-dev-admin-password@postgres:5432/lasteverlm
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    command: ["sh", "-c", "sh /db/bootstrap.sh && sh /db/migrate.sh /migrations"]
    volumes:
      - ./db:/db:ro
      - ./db/migrations:/migrations/infra:ro
      - ../core/db/migrations:/migrations/core:ro
      - ../account/db/migrations:/migrations/account:ro
      - ../ingest/db/migrations:/migrations/ingest:ro
      - ../rag/db/migrations:/migrations/rag:ro
    depends_on:
      postgres: {condition: service_healthy}

  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: local-dev-access
      RUSTFS_SECRET_KEY: local-dev-secret-key
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [storage:/data]

  # Creates the bucket once, with the ingest image's boto3; retries until the
  # storage answers.
  bucket:
    build: {context: .., dockerfile: ingest/Dockerfile}
    environment: *dev
    command:
      - python
      - -c
      - |
        import os, time, boto3
        s3 = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT"], region_name=os.environ["S3_REGION"],
                          aws_access_key_id=os.environ["S3_ACCESS_KEY"], aws_secret_access_key=os.environ["S3_SECRET_KEY"])
        name = os.environ["S3_BUCKET"]
        for attempt in range(30):
            try:
                if name not in [b["Name"] for b in s3.list_buckets().get("Buckets", [])]:
                    s3.create_bucket(Bucket=name)
                print("bucket ready:", name)
                break
            except Exception as exc:
                print("waiting for storage:", type(exc).__name__)
                time.sleep(2)
        else:
            raise SystemExit("storage did not answer")
    depends_on: [storage]

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  account:
    <<: *python-service
    healthcheck: *api-healthcheck
    build: {context: .., dockerfile: account/Dockerfile}
    environment:
      <<: *dev
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      AUTH_ALLOWED_DOMAINS: ${AUTH_ALLOWED_DOMAINS:-example.com}
      VISIT_HASH_SECRET: local-dev-visit-hash-secret
      # 32 bytes, standard base64; local only (production: generated by `make env`).
      VOUCHER_KEY: bG9jYWwtZGV2LXZvdWNoZXIta2V5LTAxMjM0NTY3ODk=
      # Seeds the SMTP setting on first start; Mailpit catches every mail.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_FROM_ADDRESS: lasteverlm@example.com
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}

  ingest:
    <<: *python-service
    healthcheck: *api-healthcheck
    build: {context: .., dockerfile: ingest/Dockerfile}
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}

  ingest-worker:
    <<: *python-service
    build: {context: .., dockerfile: ingest/Dockerfile}
    command: ["lasteverlm-ingest-worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}

  rag:
    <<: *python-service
    healthcheck: *api-healthcheck
    build: {context: .., dockerfile: rag/Dockerfile}

  rag-worker:
    <<: *python-service
    build: {context: .., dockerfile: rag/Dockerfile}
    command: ["lasteverlm-rag-worker"]

  web:
    build: {context: .., dockerfile: web/Dockerfile}
    restart: unless-stopped

  # Routes like the production ingress: /api/<service> to the service, the
  # rest to web.
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes: ["./compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      account: {condition: service_healthy}
      ingest: {condition: service_healthy}
      rag: {condition: service_healthy}
      web: {condition: service_started}

volumes:
  postgres:
  storage:
