# One-time database bootstrap (role, database, pgvector) as the admin role.
# Created by `make db-bootstrap`; __RUN_ID__ is replaced per run.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap-__RUN_ID__
  namespace: lasteverlm
  labels:
    app.kubernetes.io/name: db-bootstrap
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873   # as chart/values.yaml migrations.image
          command: ["sh", "/in/bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70   # the image's postgres user
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          envFrom:
            - secretRef:
                name: lasteverlm-db-bootstrap
          volumeMounts:
            - name: script
              mountPath: /in
              readOnly: true
            - name: pg-ca
              mountPath: /etc/lasteverlm
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: lasteverlm-db-bootstrap
        - name: pg-ca
          configMap:
            name: lasteverlm-pg-ca
