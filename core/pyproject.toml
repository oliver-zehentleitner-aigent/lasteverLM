[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lasteverlm-core"
version = "0.1.0"
description = "lasteverLM shared library: models, settings, bearer-token resolution, usage accounting, model prices, provider interfaces, object storage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Oliver Zehentleitner" }]
dependencies = [
  "pydantic>=2.7",
  "PyJWT>=2.8",
  "openai>=3",
  "anyio>=4",
  "boto3>=1.34",
]

[project.optional-dependencies]
# lasteverlm_core.web; every service has FastAPI already
web = ["fastapi>=0.115"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "black>=24",
  "mypy>=1.10",
  "psycopg[binary,pool]>=3.2",
  "httpx2>=2.12",
  "fastapi>=0.115",
  "types-boto3>=1.0",
]

[project.urls]
Homepage = "https://github.com/oliver-zehentleitner/lasteverLM-core"
Family = "https://github.com/oliver-zehentleitner/lasteverLM"

[tool.hatch.build.targets.wheel]
packages = ["src/lasteverlm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs CORE_TEST_DATABASE_URL, run by `make test-postgres`"]
asyncio_mode = "auto"
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
