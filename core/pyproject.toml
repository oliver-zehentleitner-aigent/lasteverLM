[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lasteverlm-core"
version = "0.1.0"
description = "lasteverLM shared library: models, settings, bearer-token resolution, usage accounting, model prices, provider interfaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Oliver Zehentleitner" }]
dependencies = [
  "pydantic>=2.7",
  "PyJWT>=2.8",
  "openai>=1.40",
  "anyio>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/oliver-zehentleitner/lasteverLM-core"
Family = "https://github.com/oliver-zehentleitner/lasteverLM"

[tool.hatch.build.targets.wheel]
packages = ["src/lasteverlm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["lasteverlm_core"]
strict = true
